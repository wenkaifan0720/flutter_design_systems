name: flutter_design_systems
description: The workspace of the design system packages. It is not published; its members are.
publish_to: none
repository: https://github.com/wenkaifan0720/flutter_design_systems

environment:
  sdk: ">=3.13.0 <4.0.0"

# Every package, and every package's example app. While the looks move to ui_core 0.7.2 (11-20), a look joins this
# list as its release goes out (a look still on an older ui_core can't resolve beside 0.7.2); then back to the globs.
workspace:
  - packages/ui_core
  - packages/ui_core/example
  - packages/ui_core_test
  - packages/ui_core_test/example
  - packages/ui_core_review
  - packages/ui_core_review/example
  - packages/clay_ui
  - packages/clay_ui/example
  - packages/frosted_ui
  - packages/frosted_ui/example
  - packages/keycap_ui
  - packages/keycap_ui/example
  # The skill's samples, on the ui_core beside them: a core change that breaks the skill fails CI. This line stays
  # below the packages.
  - skills/ui_core_design_system/samples

dev_dependencies:
  flutter_lints: ^6.0.0
