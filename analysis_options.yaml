# Every package in the workspace is held to these; an example app keeps its own, plainer options.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/build/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: true
    implementation_imports: true
