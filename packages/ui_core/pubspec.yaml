name: ui_core
description: >-
  Headless behaviours for Flutter design systems: the state, keyboard, focus and semantics of 40 controls, routes
  and overlays, with every pixel left to the design system.
version: 0.5.0
homepage: https://wenkaifan0720.github.io/flutter_design_systems/
documentation: https://wenkaifan0720.github.io/flutter_design_systems/docs/
repository: https://github.com/wenkaifan0720/flutter_design_systems/tree/main/packages/ui_core
issue_tracker: https://github.com/wenkaifan0720/flutter_design_systems/issues

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter


dev_dependencies:
  cupertino_ui: ^1.0.0
  material_ui: ^1.9.0
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
