name: gloss_ui
description: >-
  Skeuomorphic widgets for Flutter with glazed controls, recessed panels, accessible forms, navigation, and charts in coordinated light and dark themes.
version: 0.6.0
homepage: https://wenkaifan0720.github.io/flutter_design_systems/docs/looks/gloss/
repository: https://github.com/wenkaifan0720/flutter_design_systems/tree/main/packages/gloss_ui
issue_tracker: https://github.com/wenkaifan0720/flutter_design_systems/issues
topics:
  - design-system
  - widgets
  - ui
  - theme
  - skeuomorphism
screenshots:
  - description: "Simmer's Today on a desk at 1440 and a phone at 390, by day: the week's rows in a well, a jade gel key to start cooking."
    path: screenshots/hero.webp
  - description: "The same Today by night: the same glazed objects in low light, designed rather than inverted."
    path: screenshots/night.webp
  - description: "A recipe on a desk by day and a phone by night: the list beside the dish, a servings stepper in a well, ingredients and method tabs."
    path: screenshots/recipe.webp
  - description: "Settings on a phone by day and night: rows in wells pressed into the page, pearl switches in sunken slots."
    path: screenshots/settings.webp
  - description: "Gloss's parts at 1440: gel and pearl keys, segments, and a stepper and a switch in a well on porcelain."
    path: screenshots/parts.webp

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ui_core: ^0.8.4
  material_ui: ^1.9.0
  cupertino_ui: ^1.0.0
  lucide_icons_flutter: ">=3.1.25 <5.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  ui_core_test: ^0.6.2

flutter:
  fonts:



    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
