name: comic_ui
description: >-
  A Flutter design system drawn as a printed comic page: inked panels, speech balloons and Ben-Day dots in flat inks, every change of state a quick cut or pop.
version: 0.3.0
homepage: https://wenkaifan0720.github.io/flutter_design_systems/comic/
repository: https://github.com/wenkaifan0720/flutter_design_systems/tree/main/packages/comic_ui
issue_tracker: https://github.com/wenkaifan0720/flutter_design_systems/issues
topics:
  - design-system
  - widgets
  - ui
  - theme
  - comic
screenshots:
  - description: "Comic's cover page at desktop and phone width, by day."
    path: screenshots/hero.png
  - description: "Buttons at desktop width, by day."
    path: screenshots/buttons_1440_day.png
  - description: "Ticks, switches, chips and sliders at desktop width, at night."
    path: screenshots/selection_1440_night.png
  - description: "A settings page on a phone, at night."
    path: screenshots/settings_390_night.png
  - description: "Charts at desktop width, by day."
    path: screenshots/charts_1440_day.png
  - description: "Comic's own speech and thought balloons, bursts and stamps at desktop width, by day."
    path: screenshots/balloons_1440_day.png

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ui_core: ^0.3.0
  material_ui: ^1.9.0
  cupertino_ui: ^1.0.0
  lucide_icons_flutter: ">=3.1.25 <5.0.0"
  intl: ^0.20.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  ui_core_test: ^0.1.0

flutter:
  fonts:
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
          weight: 400
    - family: ShantellSans
      fonts:
        - asset: assets/fonts/ShantellSans-400.ttf
          weight: 400
        - asset: assets/fonts/ShantellSans-500.ttf
          weight: 500
        - asset: assets/fonts/ShantellSans-600.ttf
          weight: 600
        - asset: assets/fonts/ShantellSans-700.ttf
          weight: 700
        - asset: assets/fonts/ShantellSans-800.ttf
          weight: 800
