# ui_core_review's analysis options: ui_core's, and its library's private machinery is a copy of ui_core_test's, of
# which the review uses a part (what the review alone uses, ui_core_test's copy leaves unused in turn, as written).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: true
    implementation_imports: true
    avoid_dynamic_calls: true
    missing_code_block_language_in_doc_comment: true
    prefer_const_constructors: true
    unawaited_futures: true
    use_named_constants: true
