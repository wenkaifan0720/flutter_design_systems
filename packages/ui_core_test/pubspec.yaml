name: ui_core_test
description: >-
  Checks for Flutter design systems on ui_core of what is wrong in any design: roles, radio groups, field
  names, tap targets, cursors, labels, clipped words and cut shadows.
version: 0.5.1
homepage: https://wenkaifan0720.github.io/flutter_design_systems/
documentation: https://wenkaifan0720.github.io/flutter_design_systems/docs/
repository: https://github.com/wenkaifan0720/flutter_design_systems/tree/main/packages/ui_core_test
issue_tracker: https://github.com/wenkaifan0720/flutter_design_systems/issues
topics:
  - design-system
  - testing
  - widgets

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Its guidelines extend flutter_test's AccessibilityGuideline (guidelines.dart).
  flutter_test:
    sdk: flutter
  ui_core: ^0.7.1

dev_dependencies:
  cupertino_ui: ^1.0.0
  material_ui: ^1.9.0
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: any
