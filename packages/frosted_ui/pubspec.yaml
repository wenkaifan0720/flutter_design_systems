name: frosted_ui
description: >-
  Frosted glass for Flutter: panes rimmed with light stand on a canvas lit by soft washes of colour, and one ink act carries each page, by day and by night.
version: 0.6.1
homepage: https://wenkaifan0720.github.io/flutter_design_systems/frosted/
documentation: https://wenkaifan0720.github.io/flutter_design_systems/docs/looks/frosted/
repository: https://github.com/wenkaifan0720/flutter_design_systems/tree/main/packages/frosted_ui
issue_tracker: https://github.com/wenkaifan0720/flutter_design_systems/issues
topics:
  - design-system
  - widgets
  - ui
  - theme
  - glassmorphism
screenshots:
  - description: "Harbor, the gallery's sample app, on its Activity page at 1440 wide and on a 390 wide phone, by day."
    path: screenshots/hero.webp
  - description: "Harbor's Settings page at 1440 wide by night."
    path: screenshots/harbor-settings-desktop-night.webp
  - description: "Harbor's Activity page on a 390 wide phone by night."
    path: screenshots/harbor-activity-phone-night.webp
  - description: "Harbor's Settings page on a 390 wide phone by day."
    path: screenshots/harbor-settings-phone-day.webp
  - description: "The pearl credit card, Frosted's own, live and frozen, at 1440 wide by day."
    path: screenshots/gallery-cards-desktop-day.webp
  - description: "Segmented buttons, chips and switches on a 390 wide phone by night."
    path: screenshots/gallery-selection-phone-night.webp

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ui_core: ^0.6.0
  material_ui: ^1.9.0
  cupertino_ui: ^1.0.0
  lucide_icons_flutter: ">=3.1.25 <5.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  ui_core_test: ^0.4.0
  # Our looks' layout review, in the repository alone (publish_to: none).
  ui_core_review: ^0.1.0

flutter:
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
          weight: 400
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 400
