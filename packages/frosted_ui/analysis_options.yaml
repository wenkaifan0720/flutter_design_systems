# frosted_ui's analysis options: ui_core's (its package/analysis_options.yaml), which look:package writes for the
# package. pana and pub.dev read a package's own options, never a workspace root's, so they repeat the strict modes.
include: package:flutter_lints/flutter.yaml

# The excludes `flutter pub get` writes into a Flutter package's options that lack them: written here, pub get leaves
# the file as the build wrote it (look:check --repo compares it file for file).
analyzer:
  exclude:
    - example/build/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: true
    implementation_imports: true
    avoid_dynamic_calls: true
    missing_code_block_language_in_doc_comment: true
    prefer_const_constructors: true
    unawaited_futures: true
    use_named_constants: true
