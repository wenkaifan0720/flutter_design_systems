# material_expressive_ui's analysis options: strict modes and documented public API. pana and pub.dev read a
# package's own options, so they are set here.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - example/build/**
    - test_fixes/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated by tools/expressive_tokens from Compose's own sources (its
    # drift gate checks them against those): no hand-written code to lint.
    - lib/src/material_expressive/internal/**/*.g.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: true
    implementation_imports: true
    avoid_dynamic_calls: true
    missing_code_block_language_in_doc_comment: true
    prefer_const_constructors: true
    unawaited_futures: true
    use_named_constants: true
