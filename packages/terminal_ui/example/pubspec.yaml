name: terminal_ui_example
description: The Terminal gallery, every component in every preset by day and by night.
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  cupertino_ui: ^1.0.0
  material_ui: ^1.9.0
  flutter:
    sdk: flutter
  # The gallery's delegates for the 30 locales (the README's line): the widgets' from here, Material's from material_ui.
  flutter_localizations:
    sdk: flutter
  terminal_ui:
    path: ../
  # An example imports the foundation itself too (its inventory, say).
  ui_core: ^0.3.4


dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
