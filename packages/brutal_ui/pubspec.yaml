name: brutal_ui
description: >-
  A Flutter design system with its make-up off: heavy black rules, square corners, a hard offset shadow under what you press, cells on shared rules and one flat colour block a screen.
version: 0.1.1
homepage: https://github.com/wenkaifan0720/flutter_design_systems/tree/main/packages/brutal_ui
repository: https://github.com/wenkaifan0720/flutter_design_systems/tree/main/packages/brutal_ui
topics:
  - design-system
  - widgets
  - ui
  - theme

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ui_core: ^0.2.1
  material_ui: ^1.9.0
  cupertino_ui: ^1.0.0
  lucide_icons_flutter: ">=3.1.25 <5.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any

flutter:
  fonts:



    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
