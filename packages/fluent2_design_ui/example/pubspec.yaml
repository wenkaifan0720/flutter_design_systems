name: fluent2_design_ui_example
description: The Fluent 2 gallery, every component in every preset by day and by night.
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The gallery is an app on Flutter's Material: its delegates for the 30 locales (the README's line).
  flutter_localizations:
    sdk: flutter
  fluent2_design_ui:
    path: ../
  # An example imports the foundation itself too (its alignment sheet, say).
  ui_core: ^0.2.0
  lucide_icons_flutter: ">=3.1.25 <5.0.0"

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
