  # 0.8.0: clover's brand was Fluent's success green, so its primary read as a success; juniper is the green-blue
  # palette. Fluent2ThemeData.contrast was ui_core's RawPalette.contrastRatio. Fluent2Host's night theme is dark, as
  # its day theme is light (Fluent2Theme.darkData stays the media ground's theme).
  - title: "Use 'juniper'"
    date: 2026-11-26
    element:
      uris: ['fluent2_design_ui.dart']
      constructor: 'clover'
      inClass: 'Fluent2ThemeData'
    changes:
      - kind: 'rename'
        newName: 'juniper'

  - title: "Use 'RawPalette.contrastRatio'"
    date: 2026-11-26
    element:
      uris: ['fluent2_design_ui.dart']
      method: 'contrast'
      inClass: 'Fluent2ThemeData'
      static: true
    changes:
      - kind: 'replacedBy'
        newElement:
          uris: ['package:ui_core/ui_core.dart']
          method: 'contrastRatio'
          inClass: 'RawPalette'
          static: true

  - title: "Rename to 'dark'"
    date: 2026-11-26
    element:
      uris: ['fluent2_design_ui.dart']
      constructor: ''
      inClass: 'Fluent2Host'
    changes:
      - kind: 'renameParameter'
        oldName: 'darkData'
        newName: 'dark'

  - title: "Rename to 'dark'"
    date: 2026-11-26
    element:
      uris: ['fluent2_design_ui.dart']
      field: 'darkData'
      inClass: 'Fluent2Host'
    changes:
      - kind: 'rename'
        newName: 'dark'

