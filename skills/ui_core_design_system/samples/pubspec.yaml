name: tend
description: >-
  A small app with a design of its own on ui_core: the design folder (lib/design) and the three screens that use it.
  Every Dart block in the skill's pages is taken from it. It is tested in the repository's pub workspace, on the
  ui_core and ui_core_test beside it.
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.9.0
  ui_core: ^0.6.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  ui_core_test: ^0.4.0
