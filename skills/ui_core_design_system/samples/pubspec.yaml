name: look_ui
description: >-
  The skill's code samples, as a look of their own: every Dart block in the skill's pages is taken from this
  package, which compiles and is tested against the published ui_core and ui_core_test.
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.9.0
  ui_core: ^0.4.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  ui_core_test: ^0.2.1
